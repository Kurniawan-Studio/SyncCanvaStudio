<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyncCanvas Studio</title>
    <script>
      // Node-style shims for libs (yjs / y-webrtc / lib0) that expect them.
      window.global = window;
      window.process = window.process || { env: { NODE_ENV: 'production' } };

      // Show any runtime error on-screen instead of a white page.
      function showFatal(title, detail) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div style="padding:24px;font-family:ui-monospace,monospace;background:#1C1C1C;color:#F5F5F0;min-height:100vh">' +
            '<h1 style="color:#ff3d00;margin:0 0 12px">' + title + '</h1>' +
            '<pre style="white-space:pre-wrap;word-break:break-word">' + detail + '</pre>' +
          '</div>';
      }
      window.addEventListener('error', function (e) {
        showFatal('Runtime Error', (e.message || 'Unknown') + '\n' + (e.filename || '') + ':' + (e.lineno || 0));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        showFatal('Unhandled Promise Rejection', (r && r.message) ? r.message : String(r));
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
